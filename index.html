<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{

  --lg:#00ff88;--lgd:rgba(0,255,136,.11);--lgb:rgba(0,255,136,.32);
  --sh:#ff3355;--shd:rgba(255,51,85,.11);--shb:rgba(255,51,85,.32);
  --am:#ffaa00;--amd:rgba(255,170,0,.14);
  --tp:#e8f0ff;--ts:#7a9cc0;--tm:#3d5a7a;--td:#a8c8e8;
  --br:#0d2040;--brl:#152d50;
  --fui:'DM Sans',sans-serif;--fdt:'Space Mono',monospace;--fds:'Syne',sans-serif;
  --r:6px;--rl:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fui);background:var(--bg);color:var(--tp);min-height:100vh;font-size:14px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,212,255,.04) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(0,100,200,.04) 0%,transparent 60%);pointer-events:none;z-index:0}
#hdr{position:sticky;top:0;z-index:100;background:rgba(4,8,15,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--br);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--eld);border:1px solid var(--elb);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fds);font-weight:800;font-size:13px;color:var(--el)}
.logo-text{font-family:var(--fds);font-weight:700;font-size:15px;color:var(--tp);letter-spacing:-.3px}
.logo-badge{font-family:var(--fdt);font-size:9px;color:var(--el);background:var(--eld);border:1px solid var(--elb);padding:1px 5px;border-radius:3px;letter-spacing:1px}
.hdr-r{display:flex;align-items:center;gap:10px}
#clock{font-family:var(--fdt);font-size:11px;color:var(--ts);letter-spacing:.5px}
.hbtn{font-family:var(--fui);font-size:11px;font-weight:500;padding:4px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--brl);background:var(--bg2);color:var(--ts);transition:all .15s}
.hbtn:hover{color:var(--tp);border-color:var(--elb)}
.hbtn.danger{color:var(--sh);border-color:var(--shb);background:var(--shd)}
#nav{background:var(--bg2);border-bottom:1px solid var(--br);padding:0 20px;display:flex;overflow-x:auto;position:sticky;top:52px;z-index:99}
#nav::-webkit-scrollbar{display:none}
.ntab{font-family:var(--fui);font-size:12px;font-weight:500;padding:11px 16px;cursor:pointer;color:var(--tm);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;letter-spacing:.2px}
.ntab:hover{color:var(--ts)}
.ntab.active{color:var(--el);border-bottom-color:var(--el)}
#ct{padding:20px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--bgc);border:1px solid var(--brl);border-radius:var(--rl);padding:18px}
.cdk{background:var(--bg2);border:1px solid var(--br);border-radius:var(--r)}
.slbl{font-family:var(--fdt);font-size:9px;font-weight:700;letter-spacing:2px;color:var(--tm);text-transform:uppercase;margin-bottom:14px}
.slong{background:var(--lgd);border:1px solid var(--lgb);border-radius:var(--rl)}
.sshort{background:var(--shd);border:1px solid var(--shb);border-radius:var(--rl)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-family:var(--fdt);font-size:10px;font-weight:700;letter-spacing:.5px}
.blong{background:var(--lgd);color:var(--lg);border:1px solid var(--lgb)}
.bshort{background:var(--shd);color:var(--sh);border:1px solid var(--shb)}
.bhigh{background:rgba(255,51,85,.15);color:#ff8099}
.bmed{background:rgba(255,170,0,.15);color:var(--am)}
.blow{background:rgba(0,255,136,.1);color:#66ffc2}
.binfo{background:var(--eld);color:var(--el)}
.pbwrap{width:100%;height:4px;background:var(--br);border-radius:2px;overflow:hidden}
.pbfill{height:100%;border-radius:2px;transition:width .4s ease}
.plong{background:linear-gradient(90deg,var(--lg),#00cc70)}
.pshort{background:linear-gradient(90deg,var(--sh),#cc2244)}
.flbl{display:block;font-size:11px;font-weight:500;color:var(--ts);margin-bottom:5px;letter-spacing:.3px}
.inp{width:100%;padding:8px 12px;background:var(--bgi);border:1px solid var(--brl);border-radius:var(--r);color:var(--tp);font-family:var(--fui);font-size:13px;transition:border-color .15s;outline:none}
.inp:focus{border-color:var(--elb)}
.inp option{background:var(--bgc)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.btn{padding:8px 16px;border-radius:var(--r);font-family:var(--fui);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--brl);background:var(--bg2);color:var(--tp)}
.btnp{background:rgba(0,140,200,.2);border:1px solid rgba(0,180,255,.4);color:var(--el)}
.btnp:hover{background:rgba(0,160,220,.3)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{padding:8px 10px;text-align:left;color:var(--tm);font-family:var(--fdt);font-size:9px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--br);font-weight:700}
.dtbl td{padding:8px 10px;border-bottom:1px solid var(--br);color:var(--td)}
.dtbl tr:hover td{background:var(--bgh)}
.dtbl tr:last-child td{border-bottom:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--brl);border-radius:2px}
#moverlay{display:none;position:fixed;inset:0;background:rgba(4,8,15,.85);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#mbox{background:var(--bgc);border:1px solid var(--brl);border-radius:12px;padding:24px;width:480px;max-width:90%;max-height:80vh;overflow-y:auto}
.notif{position:fixed;top:64px;right:20px;z-index:300;padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:500;animation:sin .25s ease}
@keyframes sin{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.tfg{display:flex;gap:6px;flex-wrap:wrap}
.tfb{padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--fdt);cursor:pointer;border:1px solid var(--brl);background:var(--bg2);color:var(--tm);transition:all .15s;letter-spacing:.5px}
.tfb.active{background:var(--eld);border-color:var(--elb);color:var(--el)}
.dirg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dirb{padding:10px;border-radius:var(--r);font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;border:1px solid var(--brl);background:var(--bg2);color:var(--tm);font-family:var(--fui)}
.ua{background:var(--lgd);border-color:var(--lgb);color:var(--lg)}
.da{background:var(--shd);border-color:var(--shb);color:var(--sh)}
#mpbox{padding:12px;border-radius:var(--r);background:var(--bgi);border:1px solid var(--brl);font-size:12px;transition:border-color .2s}
.mcard{background:var(--bgc);border:1px solid var(--br);border-radius:var(--r);padding:14px}
.mlbl{font-size:10px;color:var(--tm);letter-spacing:.5px;margin-bottom:6px;font-family:var(--fdt);text-transform:uppercase}
.mval{font-family:var(--fdt);font-size:22px;font-weight:700;color:var(--tp)}
.amini{background:var(--bg2);border:1px solid var(--br);border-radius:var(--r);padding:10px 12px;transition:border-color .15s}
.amini:hover{border-color:var(--brl)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--br)}
.crow:last-child{border-bottom:none}
.fdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lg);animation:pulse 2s infinite;margin-left:4px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.tlong{color:var(--lg)}.tshort{color:var(--sh)}.tam{color:var(--am)}.tel{color:var(--el)}.tmut{color:var(--tm)}.tsec{color:var(--ts)}
.tsm{font-size:11px}.txs{font-size:10px}.mono{font-family:var(--fdt)}.bold{font-weight:600}
.fb{display:flex;align-items:center}.fbet{display:flex;justify-content:space-between;align-items:center}
.g8{gap:8px}.g12{gap:12px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.wf{width:100%}.tr{text-align:right}.tc{text-align:center}
@media(max-width:768px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g5{grid-template-columns:1fr 1fr}.g5a{grid-template-columns:1fr 1fr}#ct{padding:12px}}
</style>
</head>

// ── ENGINE ──
function engine(){
  const map={};
  const now=Date.now();
  const fresh=d=>now-new Date(d).getTime()<7*86400000;
  [...S.macro].filter(m=>fresh(m.date)).sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(m=>{
    const R=RULES[m.event]; if(!R) return;
    const beat=m.actual>m.expected;
    const mag=Math.abs(m.actual-m.expected)/(Math.abs(m.expected)||1);
    const rs=beat?R.beat:R.miss;
    rs.forEach(r=>{
      let p=r.p;
      if(mag>0.1)p=Math.min(95,p+5);
      if(mag<0.02)p=Math.max(48,p-5);
      const k=`${r.a}_${r.d}`;
      if(!map[k]) map[k]={asset:r.a,dir:r.d,prob:p,reason:r.r,type:'MACRO',event:m.event,date:m.date,count:1,sources:[m.event],fresh:true};
      else{map[k].count++;map[k].sources.push(m.event);map[k].prob=Math.min(96,map[k].prob+Math.floor(p*.12));}
    });
  });
  const lp={};
  S.prices.forEach(p=>{if(!lp[p.asset]||new Date(p.date)>new Date(lp[p.asset].date))lp[p.asset]=p;});
  function ac(rs,ev,dt,re){
    rs.forEach(r=>{
      const k=`${r.a}_${r.d}`;
      if(!map[k]) map[k]={asset:r.a,dir:r.d,prob:r.p,reason:re,type:'CORR',event:ev,date:dt,count:1,sources:[ev],fresh:dt?fresh(dt):false};
      else{map[k].count++;map[k].sources.push(ev);map[k].prob=Math.min(96,map[k].prob+Math.floor(r.p*.12));}
    });
  }
  const dxy=lp['DXY'];
  if(dxy&&dxy.change_pct>=0.5) dxy.direction==='up'?ac(CORR.DXY_UP.s,'DXY',dxy.date,`DXY ↑${dxy.change_pct}% → Inverse Crypto/FX`):ac(CORR.DXY_DOWN.s,'DXY',dxy.date,`DXY ↓${dxy.change_pct}% → Bullish Crypto`);
  const vix=lp['VIX'];
  if(vix&&vix.price){const v=vix.price;if(v>=30)ac(CORR.VIX30.s,'VIX',vix.date,`VIX ${v} EXTREME → Mass Risk Off`);else if(v>=25)ac(CORR.VIX25.s,'VIX',vix.date,`VIX ${v} DANGER → Risk Off Mode`);else if(v>=20)ac(CORR.VIX20.s,'VIX',vix.date,`VIX ${v} Elevated → Caution`);}
  const spx=lp['SPX'];
  if(spx&&spx.change_pct>=1) spx.direction==='down'?ac(CORR.SPX_DOWN.s,'SPX',spx.date,`SPX ↓${spx.change_pct}% → Equities Risk Off`):ac(CORR.SPX_UP.s,'SPX',spx.date,`SPX ↑${spx.change_pct}% → Risk On`);
  const btcd=lp['BTC.D'];
  if(btcd&&btcd.change_pct>=0.5) btcd.direction==='up'?ac(CORR.BTCD_UP.s,'BTC.D',btcd.date,`BTC.D ↑${btcd.change_pct}% → Alt Rotation Out`):ac(CORR.BTCD_DOWN.s,'BTC.D',btcd.date,`BTC.D ↓${btcd.change_pct}% → Alt Season Bias`);
  S.signals=Object.values(map).sort((a,b)=>b.prob-a.prob);
  return S.signals;
}

function lp(){const m={};S.prices.forEach(p=>{if(!m[p.asset]||new Date(p.date)>new Date(m[p.asset].date))m[p.asset]=p;});return m;}
function pb(p,d){return `<div class="pbwrap"><div class="pbfill ${d==='LONG'?'plong':'pshort'}" style="width:${p}%"></div></div>`;}
function bx(t,c){return `<span class="badge ${c}">${t}</span>`;}
function ds(d){return d==='up'||d==='LONG'?'tlong':'tshort';}
function nr(n){return Number(n).toLocaleString();}

let PC,MC,SC;
function initCharts(){rpc();rmc();rsc();}

function cOpts(){
  return{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#7a9cc0',font:{size:11,family:'Space Mono'}}}},
    scales:{x:{grid:{color:'#0d2040'},ticks:{color:'#3d5a7a',font:{size:10},maxRotation:45}},y:{grid:{color:'#0d2040'},ticks:{color:'#3d5a7a',font:{size:10}}}}};
}

function rpc(){
  const a=document.getElementById('ca')?.value||'BTC';
  const tf=document.getElementById('ct2')?.value||'';
  let d=S.prices.filter(p=>p.asset===a);
  if(tf)d=d.filter(p=>p.timeframe===tf);
  d.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(PC)PC.destroy();
  const ctx=document.getElementById('pcanvas');if(!ctx)return;
  PC=new Chart(ctx,{type:'line',data:{labels:d.map(p=>p.date),datasets:[
    {label:`${a} Price`,data:d.map(p=>p.price),borderColor:'#00d4ff',backgroundColor:'rgba(0,212,255,.06)',tension:.35,fill:true,yAxisID:'y'},
    {label:'Change %',data:d.map(p=>p.direction==='up'?p.change_pct:-p.change_pct),borderColor:'#00ff88',backgroundColor:'transparent',tension:.35,fill:false,yAxisID:'y1',borderDash:[4,4]}
  ]},options:{...cOpts(),interaction:{mode:'index',intersect:false},scales:{
    x:{grid:{color:'#0d2040'},ticks:{color:'#3d5a7a',font:{size:10},maxRotation:45}},
    y:{grid:{color:'#0d2040'},ticks:{color:'#3d5a7a',font:{size:10}}},
    y1:{position:'right',grid:{display:false},ticks:{color:'#3d5a7a',font:{size:10}}}
  }}});
}
function rmc(){
  if(MC)MC.destroy();
  const ctx=document.getElementById('mcanvas');if(!ctx)return;
  const d=[...S.macro].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-20);
  MC=new Chart(ctx,{type:'bar',data:{labels:d.map(m=>`${m.event} ${m.date.slice(5)}`),datasets:[{
    label:'Actual − Expected',data:d.map(m=>parseFloat((m.actual-m.expected).toFixed(2))),
    backgroundColor:d.map(m=>m.actual>m.expected?'rgba(255,51,85,.6)':'rgba(0,255,136,.5)'),
    borderColor:d.map(m=>m.actual>m.expected?'#ff3355':'#00ff88'),borderWidth:1}]},options:cOpts()});
}
function rsc(){
  if(SC)SC.destroy();
  const ctx=document.getElementById('scanvas');if(!ctx)return;
  engine();
  const l=S.signals.filter(s=>s.dir==='LONG').length,sh=S.signals.filter(s=>s.dir==='SHORT').length;
  SC=new Chart(ctx,{type:'doughnut',data:{labels:[`LONG (${l})`,`SHORT (${sh})`],datasets:[{
    data:[l,sh],backgroundColor:['rgba(0,255,136,.6)','rgba(255,51,85,.6)'],borderColor:['#00ff88','#ff3355'],borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#7a9cc0',font:{size:11,family:'Space Mono'}}}}}});
}

function pgSigs(){

  const fs=sigs.filter(s=>ASSETS.Currency.includes(s.asset));
  const ks=sigs.filter(s=>ASSETS.Commodity.includes(s.asset));
  const is=sigs.filter(s=>ASSETS.Index.includes(s.asset));
  function sb(title,icon,list){
    return `<div class="card mb16"><div class="slbl">${icon} ${title} (${list.length})</div>
      ${list.length===0?`<p class="tmut tsm">No signals. Input data terlebih dahulu.</p>`:

          <div style="width:68px">${bx(s.dir,s.dir==='LONG'?'blong':'bshort')}</div>

          </div>

function tblT(){
  if(!S.trades.length) return `<p class="tmut tsm">Belum ada trade log.</p>`;
  return `<table class="dtbl"><thead><tr><th>Tanggal</th><th>Aset</th><th>Dir</th><th>Entry</th><th>Exit</th><th>P/L</th><th>Trigger</th><th>Notes</th><th></th></tr></thead><tbody>
  ${S.trades.map(t=>{
    const pl=t.exit?((t.exit-t.entry)/t.entry*100*(t.dir==='LONG'?1:-1)).toFixed(2):null;
    return `<tr><td class="mono">${t.date}</td><td class="bold">${t.asset}</td><td>${bx(t.dir,t.dir==='LONG'?'blong':'bshort')}</td>
      <td class="mono">${nr(t.entry)}</td><td class="mono">${t.exit?nr(t.exit):'—'}</td>
      <td class="mono bold ${pl>0?'tlong':pl<0?'tshort':'tmut'}">${pl!==null?(pl>0?'+':'')+pl+'%':'Open'}</td>
      <td class="txs tel">${t.trigger||'—'}</td><td class="txs tmut">${t.notes||'—'}</td>
      <td><button onclick="delT('${t.id}')" style="color:var(--sh);background:none;border:none;cursor:pointer">✕</button></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function saveP(){
  const d=document.getElementById('pd').value,a=document.getElementById('pa').value;
  const p=parseFloat(document.getElementById('pp').value),c=parseFloat(document.getElementById('pc').value);
  const n=document.getElementById('pn').value;
  if(!d||!a) return notif('Isi tanggal & aset!','err');
  S.prices.push({id:Date.now()+'',date:d,asset:a,price:isNaN(p)?null:p,change_pct:isNaN(c)?0:Math.abs(c),direction:S.dir,timeframe:S.tf,notes:n});

  const box=document.getElementById('mpbox');
  box.style.borderColor=b?'var(--shb)':'var(--lgb)';
  box.innerHTML=`<div class="fbet mb8"><span class="bold" style="color:${b?'var(--sh)':'var(--lg)'}">${b?'📈 BEAT — RISK OFF':'📉 MISS — RISK ON'}</span><span class="mono txs tmut">${x} → ${a} (${df>0?'+':''}${df})</span></div>`;
  const R=RULES[ev];
  if(R){const rs=b?R.beat:R.miss;
    document.getElementById('qsig').innerHTML=rs.slice(0,6).map(r=>`<div class="fbet" style="padding:4px 0;border-bottom:1px solid var(--br)"><span class="tsec tsm">${r.a}</span><div style="display:flex;gap:8px;align-items:center">${bx(r.d,r.d==='LONG'?'blong':'bshort')}<span class="mono bold txs" style="color:${r.d==='LONG'?'var(--lg)':'var(--sh)'}">${r.p}%</span></div></div>`).join('');}
}
function updUnit(el){const o=el.options[el.selectedIndex];const u=`(${o.dataset.u})`;document.getElementById('ul').textContent=u;document.getElementById('ul2').textContent=u;lprev();}
function filterP(a){let d=a?S.prices.filter(p=>p.asset===a):[...S.prices];d=d.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);document.getElementById('ph').innerHTML=tblP(d);}
function filterM(e){let d=e?S.macro.filter(m=>m.event===e):[...S.macro];d=d.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);document.getElementById('mh').innerHTML=tblM(d);}
function delP(id){S.prices=S.prices.filter(p=>p.id!==id);save();const r=[...S.prices].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);document.getElementById('ph').innerHTML=tblP(r);}
function delM(id){S.macro=S.macro.filter(m=>m.id!==id);save();const r=[...S.macro].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);document.getElementById('mh').innerHTML=tblM(r);}
function delT(id){S.trades=S.trades.filter(t=>t.id!==id);save();const tl=document.getElementById('tlog');if(tl)tl.innerHTML=tblT();}
function openTM(){
  document.getElementById('mbox').innerHTML=`
    <div class="bold mb16" style="font-size:15px">📓 Log Trade</div>
    <div class="mb12"><label class="flbl">Tanggal</label><input type="date" class="inp" id="td" value="${new Date().toISOString().split('T')[0]}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="mb12">
      <div><label class="flbl">Aset</label><input class="inp" id="ta" placeholder="BTC"></div>
      <div><label class="flbl">Direction</label><select class="inp" id="tdr"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="mb12">
      <div><label class="flbl">Entry Price</label><input type="number" class="inp" id="ten" placeholder="45000" step="0.01"></div>
      <div><label class="flbl">Exit Price</label><input type="number" class="inp" id="tex" placeholder="opsional" step="0.01"></div>
    </div>
    <div class="mb12"><label class="flbl">Macro Trigger</label><input class="inp" id="ttr" placeholder="e.g. CPI Miss, NFP Beat, VIX >25"></div>
    <div class="mb16"><label class="flbl">Notes</label><textarea class="inp" id="tn" placeholder="Reasoning, entry criteria..."></textarea></div>
    <div style="display:flex;gap:10px">
      <button class="btn btnp" style="flex:1" onclick="saveTrade()">Simpan</button>
      <button class="btn" style="flex:1" onclick="closeM()">Batal</button>
    </div>`;
  document.getElementById('moverlay').style.display='flex';
}
function saveTrade(){
  S.trades.unshift({id:Date.now()+'',date:document.getElementById('td').value,asset:document.getElementById('ta').value,dir:document.getElementById('tdr').value,entry:parseFloat(document.getElementById('ten').value),exit:parseFloat(document.getElementById('tex').value)||null,trigger:document.getElementById('ttr').value,notes:document.getElementById('tn').value});
  save();closeM();const tl=document.getElementById('tlog');if(tl)tl.innerHTML=tblT();
}
function closeM(){document.getElementById('moverlay').style.display='none';}

// ── DATA MANAGEMENT ──
function exportData(){
  const d={prices:S.prices,macro:S.macro,trades:S.trades,exported:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`macrotrader_${new Date().toISOString().split('T')[0]}.json`;a.click();
  notif('📤 Data exported!','ok');
}
function importData(){document.getElementById('fimp').click();}
function handleImp(e){
  const f=e.target.files[0];if(!f) return;
  const r=new FileReader();r.onload=ev=>{
    try{const d=JSON.parse(ev.target.result);if(d.prices)S.prices=d.prices;if(d.macro)S.macro=d.macro;if(d.trades)S.trades=d.trades;save();render(S.tab);notif('✅ Data imported!','ok');}
    catch(err){notif('❌ File tidak valid','err');}
  };r.readAsText(f);e.target.value='';
}
function clearAll(){
  if(!confirm('⚠️ Hapus semua data? Tidak bisa di-undo!')) return;
  S.prices=[];S.macro=[];S.trades=[];save();render(S.tab);notif('🗑️ Data dihapus','ok');
}

// ── UTILITIES ──
function notif(msg,type){
  const el=document.createElement('div');el.className='notif';
  el.style.cssText=`background:${type==='ok'?'rgba(0,60,30,.96)':'rgba(60,0,20,.96)'};color:${type==='ok'?'#00ff88':'#ff8099'};border:1px solid ${type==='ok'?'var(--lgb)':'var(--shb)'}`;
  el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('id-ID',{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}

// ── INIT ──
tick();setInterval(tick,1000);render('dashboard');
</script>
</body>
</html>
