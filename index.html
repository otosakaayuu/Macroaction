<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BBMacro Terminal v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#06090f;--bg2:#0d1420;--bg3:#131c2e;--border:rgba(249,115,22,.18);--border2:rgba(255,255,255,.07);--amber:#f97316;--amber2:#fb923c;--amber3:rgba(249,115,22,.12);--green:#00e87a;--red:#ff2a45;--blue:#38bdf8;--gray:#64748b;--text:#e2e8f0;--text2:#94a3b8;--text3:#475569;--mono:'JetBrains Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif;--r:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow-x:hidden}
input,select,textarea{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
select option{background:var(--bg2);color:var(--text)}
button{cursor:pointer;border:none;font-family:var(--sans);transition:all .15s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:rgba(249,115,22,.3)}
.hidden{display:none!important}
/* ── HEADER ── */
#hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-family:var(--cond);font-size:22px;font-weight:800;letter-spacing:2px;color:var(--amber);white-space:nowrap}
.logo span{color:var(--text3)}
.hstat{background:var(--bg3);border:.5px solid var(--border2);border-radius:var(--r);padding:4px 10px;font-family:var(--mono);font-size:11px;white-space:nowrap}
.hstat b{color:var(--amber)}
/* ── TABS ── */
#tabs{display:flex;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:.5px solid var(--border2);overflow-x:auto;flex-shrink:0}
.tab{padding:6px 13px;border-radius:var(--r);font-size:12px;font-family:var(--cond);font-weight:700;letter-spacing:.5px;background:transparent;color:var(--text2);border:.5px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{background:var(--amber3);color:var(--amber)}
.tab.active{background:var(--amber3);color:var(--amber);border-color:var(--border)}
/* ── CONTENT ── */
#content{padding:14px 16px;min-height:0;overflow-y:auto}
/* ── PANELS ── */
.panel{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.panel-title{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--amber);margin-bottom:12px;text-transform:uppercase}
/* ── GRIDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}
/* ── STAT CARDS ── */
.scard{background:var(--bg3);border:.5px solid var(--border2);border-radius:var(--r);padding:10px 12px}
.slabel{font-size:9px;color:var(--text3);letter-spacing:.8px;font-family:var(--cond);margin-bottom:3px;text-transform:uppercase}
.sval{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.1}
.schg{font-family:var(--mono);font-size:11px;margin-top:2px}
/* ── TABLE ── */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:left;font-family:var(--cond);font-size:10px;letter-spacing:.8px;color:var(--text3);font-weight:700;text-transform:uppercase;border-bottom:.5px solid var(--border2)}
td{padding:7px 10px;border-bottom:.5px solid rgba(255,255,255,.03);font-family:var(--mono)}
tr:hover td{background:rgba(255,255,255,.02)}
/* ── BADGES ── */
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.5px}
.b-g{background:rgba(0,232,122,.14);color:var(--green);border:.5px solid rgba(0,232,122,.3)}
.b-r{background:rgba(255,42,69,.14);color:var(--red);border:.5px solid rgba(255,42,69,.3)}
.b-a{background:rgba(249,115,22,.14);color:var(--amber);border:.5px solid var(--border)}
.b-gr{background:rgba(100,116,139,.14);color:var(--gray);border:.5px solid rgba(100,116,139,.2)}
/* ── BUTTONS ── */
.btn1{background:var(--amber);color:#000;padding:8px 18px;border-radius:var(--r);font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.5px}
.btn1:hover{background:var(--amber2)}
.btn2{background:var(--bg3);color:var(--text2);padding:7px 13px;border-radius:var(--r);border:.5px solid var(--border2);font-family:var(--cond);font-size:12px;font-weight:600}
.btn2:hover{border-color:var(--border);color:var(--text)}
.btnd{background:rgba(255,42,69,.12);color:var(--red);padding:4px 9px;border-radius:4px;font-size:11px;border:.5px solid rgba(255,42,69,.25);font-family:var(--cond);font-weight:600}
.btntf{padding:6px 11px;border-radius:var(--r);border:.5px solid var(--border2);font-family:var(--cond);font-size:11px;font-weight:700;background:var(--bg3);color:var(--text2)}
.btntf.act{background:rgba(249,115,22,.18);border-color:var(--border);color:var(--amber)}
/* ── SIGNAL CARDS ── */
.sigcard{background:var(--bg3);border:.5px solid var(--border2);border-radius:var(--r);padding:10px 12px}
.sigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;margin-bottom:12px}
.pbar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:5px;overflow:hidden}
/* ── ASSET INPUTS ── */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.ainput{background:var(--bg3);border:.5px solid var(--border2);border-radius:var(--r);padding:8px 10px}
.akey{font-family:var(--mono);font-size:10px;color:var(--amber);font-weight:700;margin-bottom:3px}
/* ── CORR MATRIX ── */
.ccell{width:40px;height:28px;text-align:center;vertical-align:middle;font-family:var(--mono);font-size:10px;cursor:pointer;border-radius:3px;font-weight:600;transition:outline .1s}
/* ── MODAL ── */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.mtitle{font-family:var(--cond);font-size:16px;font-weight:800;color:var(--amber);margin-bottom:16px;letter-spacing:1px;text-transform:uppercase}
.flabel{font-size:10px;color:var(--text3);font-family:var(--cond);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:4px;font-weight:700}
.fgroup{margin-bottom:11px}
/* ── NOTIF ── */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:var(--r);font-size:13px;font-family:var(--cond);font-weight:700;letter-spacing:.5px;z-index:999;transition:opacity .3s;opacity:0;pointer-events:none}
#notif.show{opacity:1}
#notif.ok{background:rgba(0,232,122,.18);border:.5px solid var(--green);color:var(--green)}
#notif.err{background:rgba(255,42,69,.18);border:.5px solid var(--red);color:var(--red)}
/* ── MISC ── */
.sep{height:.5px;background:var(--border2);margin:12px 0}
.stitle{font-family:var(--cond);font-size:10px;letter-spacing:.8px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:8px;margin-top:2px}
.tip-box{background:rgba(249,115,22,.06);border:.5px solid rgba(249,115,22,.18);border-radius:var(--r);padding:10px 14px;font-size:12px;color:#94a3b8;line-height:1.8}
/* ── REGIME CARD ── */
.rcard{border-radius:var(--r);padding:14px 16px;border:.5px solid}
</style>
</head>
<body>
<div id="notif"></div>

<!-- MODAL -->
<div id="modal" class="moverlay hidden" onclick="if(event.target.id==='modal')closeModal()">
  <div class="mbox"><div id="mcontent"></div></div>
</div>

<!-- HEADER -->
<div id="hdr">

<div id="tabs">

  <button class="tab" onclick="go('chart')">📉 Chart</button>

</div>

function fmt(v,dp){if(v===null||v===undefined||v==="")return"—";return Number(v).toFixed(dp);}
function pct(a,b){if(!a||!b||b===0)return null;return(a-b)/b*100;}
function pctStr(v,sf=2){if(v===null||v===undefined)return"—";return(v>=0?"+":"")+v.toFixed(sf)+"%";}
function pctCol(v){if(v===null||v===undefined)return"#64748b";return v>0?"#00e87a":v<0?"#ff2a45":"#64748b";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function today(){return new Date().toISOString().split("T")[0];}

function calcBias(mh,days=90){
  if(!mh||!mh.length)return 0;
  const cut=new Date();cut.setDate(cut.getDate()-days);
  const recent=mh.filter(e=>new Date(e.date)>=cut);
  let sc=0;
  recent.forEach(e=>{const mt=MTYPES[e.type];if(mt){const oc=mt.o.find(o=>o.k===e.outcome);if(oc)sc+=oc.b;}});
  return Math.max(-10,Math.min(10,sc));
}
function biasInfo(sc){
  if(sc>=6)return{l:"STRONG RISK-ON 🟢",c:"#00e87a",bc:"rgba(0,232,122,.3)"};
  if(sc>=2)return{l:"MILD RISK-ON 🟡",c:"#86efac",bc:"rgba(0,232,122,.15)"};
  if(sc>-2)return{l:"NEUTRAL ⚪",c:"#94a3b8",bc:"rgba(100,116,139,.2)"};
  if(sc>-6)return{l:"MILD RISK-OFF 🟠",c:"#fca5a5",bc:"rgba(255,42,69,.15)"};
  return{l:"STRONG RISK-OFF 🔴",c:"#ff2a45",bc:"rgba(255,42,69,.3)"};
}

function outBadge(oc){
  if(oc==="HOT"||oc==="HAWKISH"||oc==="WEAK")return`<span class="badge b-r">${oc}</span>`;
  if(oc==="COOL"||oc==="DOVISH"||oc==="STRONG")return`<span class="badge b-g">${oc}</span>`;
  return`<span class="badge b-a">${oc}</span>`;
}
function dirBadge(d){
  if(d===L)return`<span style="color:#00e87a;font-size:11px;font-weight:700;font-family:var(--mono)">▲ LONG</span>`;
  if(d===S)return`<span style="color:#ff2a45;font-size:11px;font-weight:700;font-family:var(--mono)">▼ SHORT</span>`;
  return`<span style="color:#64748b;font-size:11px;font-family:var(--mono)">● NETRAL</span>`;
}

function filterByTf(ph,tf){
  if(!ph||!ph.length)return ph;
  if(tf==="ALL")return ph;
  const ref=ph[ph.length-1]?.date;if(!ref)return ph;
  const d=new Date(ref);
  if(tf==="1W")d.setDate(d.getDate()-7);
  else if(tf==="2W")d.setDate(d.getDate()-14);
  else if(tf==="1M")d.setDate(d.getDate()-30);
  else if(tf==="3M")d.setDate(d.getDate()-90);
  else if(tf==="1Y")d.setDate(d.getDate()-365);
  return ph.filter(p=>new Date(p.date)>=d);
}

function pearson(x,y){
  const n=x.length;if(n<5)return null;
  const mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n;
  let num=0,dx2=0,dy2=0;
  for(let i=0;i<n;i++){num+=(x[i]-mx)*(y[i]-my);dx2+=(x[i]-mx)**2;dy2+=(y[i]-my)**2;}
  const den=Math.sqrt(dx2*dy2);return den===0?0:Math.round(num/den*100);
}

function calcCorr(ph,keys){
  const ret={};keys.forEach(k=>{ret[k]=[];});
  for(let i=1;i<ph.length;i++){
    const pv=ph[i-1].prices,cv=ph[i].prices;
    keys.forEach(k=>{
      ret[k].push((pv[k]&&cv[k]&&pv[k]>0)?((cv[k]-pv[k])/pv[k]):null);
    });
  }
  const mat={};
  keys.forEach(k1=>{mat[k1]={};keys.forEach(k2=>{
    if(k1===k2){mat[k1][k2]=100;return;}
    const px=[],py=[];
    ret[k1].forEach((v,i)=>{if(v!==null&&ret[k2][i]!==null){px.push(v);py.push(ret[k2][i]);}});
    mat[k1][k2]=pearson(px,py);
  });});
  return mat;
}

function corrBg(v){
  if(v===null)return"#1a1a2e";if(v===100)return"#1e2030";
  if(v>=70)return"rgba(0,200,100,.22)";if(v>=40)return"rgba(0,200,100,.1)";
  if(v>=-40)return"rgba(100,116,139,.1)";if(v>=-70)return"rgba(255,42,69,.1)";
  return"rgba(255,42,69,.22)";
}
function corrCol(v){
  if(v===null||v===100)return"#475569";
  if(v>=40)return"#00e87a";if(v<=-40)return"#ff2a45";return"#64748b";
}

  const el=document.getElementById("notif");

function updateHeader(){
  const la=ST.priceHistory.slice(-1)[0];
  const pr=ST.priceHistory.slice(-2)[0];
  function setH(id,k,dp){
    const el=document.getElementById(id);if(!el)return;
    const v=la?.prices?.[k],pv=pr?.prices?.[k];
    if(!v){el.textContent="—";el.style.color="#64748b";return;}
    const c=pct(v,pv);
    el.textContent=fmt(v,dp)+(c!==null?" "+(c>=0?"+":"")+c.toFixed(2)+"%":"");
    el.style.color=c===null?"#f97316":c>0?"#00e87a":c<0?"#ff2a45":"#94a3b8";
  }
  setH("h-btc","BTC",0);setH("h-eth","ETH",0);setH("h-dxy","DXY",2);setH("h-gold","GOLD",0);setH("h-vix","VIX",2);
  const yEl=document.getElementById("h-10y");
  if(yEl){const v=la?.prices?.US10Y;yEl.textContent=v?fmt(v,3)+"%":"—";yEl.style.color=v?"#38bdf8":"#64748b";}
  const bias=calcBias(ST.macroHistory);
  const bi=biasInfo(bias);
  const bEl=document.getElementById("h-bias");
  if(bEl){bEl.textContent=bi.l.replace(/[🟢🟡⚪🟠🔴]/g,"")+" ("+bias+")";bEl.style.color=bi.c;}
  const dEl=document.getElementById("h-date");
  if(dEl)dEl.textContent=new Date().toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}

function renderDash(){
  const ph=ST.priceHistory,mh=ST.macroHistory;
  const la=ph.slice(-1)[0],pr1=ph.slice(-2)[0];
  const refDate=la?.date?new Date(la.date):new Date();
  function nearPrev(days){const cut=new Date(refDate);cut.setDate(cut.getDate()-days);return ph.filter(p=>new Date(p.date)<=refDate&&new Date(p.date)>=cut)[0]||ph[0]||null;}
  const p1d=pr1||null,p1w=nearPrev(7),p1m=nearPrev(30),p3m=nearPrev(90),p1y=nearPrev(365);
  const bias=calcBias(mh,90);const bi=biasInfo(bias);
  const recentM=[...mh].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  document.getElementById("content").innerHTML=`
  <div>
    <!-- BIAS -->
    <div class="panel" style="border-color:${bi.bc}">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div>
          <div style="font-size:9px;color:#64748b;letter-spacing:.8px;font-family:var(--cond);margin-bottom:5px">MACRO BIAS — 90 HARI TERAKHIR</div>
          <div style="font-size:24px;font-weight:800;color:${bi.c};font-family:var(--cond);letter-spacing:1px">${bi.l}</div>
          <div style="font-size:12px;color:#64748b;margin-top:3px;font-family:var(--mono)">Score: <span style="color:${bi.c}">${bias>=0?"+":""}${bias}</span> / 10 &nbsp;·&nbsp; ${mh.length} event logged</div>
        </div>
        <div style="flex:1;min-width:180px">
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#475569;margin-bottom:3px;font-family:var(--cond)"><span>RISK OFF</span><span>NEUTRAL</span><span>RISK ON</span></div>

            <div style="width:${Math.abs(bias)*5}%;height:100%;background:${bi.c};margin-left:${bias>=0?50:50+bias*5}%;border-radius:3px"></div>

}

function savePrice(){
  const date=document.getElementById("pi_date")?.value;
  if(!date){notif("Pilih tanggal!","err");return;}
  const prices={};
  ASSETS.forEach(a=>{const el=document.getElementById("pi_"+a.k);if(el&&el.value!=="")prices[a.k]=parseFloat(el.value);});
  if(!Object.keys(prices).length){notif("Isi minimal 1 harga!","err");return;}
  const idx=ST.priceHistory.findIndex(p=>p.date===date);
  if(idx>=0)ST.priceHistory[idx]={date,prices:{...ST.priceHistory[idx].prices,...prices}};
  else{ST.priceHistory.push({date,prices});ST.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));}
  savePrices();updateHeader();renderPrices();notif("✓ Harga disimpan — "+date);
}

function loadDatePrices(date){
  const e=ST.priceHistory.find(p=>p.date===date);
  if(!e){notif("Tidak ada data untuk tanggal ini","err");return;}
  const pidate=document.getElementById("pi_date");
  if(pidate)pidate.value=date;
  ASSETS.forEach(a=>{const el=document.getElementById("pi_"+a.k);if(el)el.value=e.prices[a.k]!==undefined?e.prices[a.k]:"";});
  notif("✓ Data "+date+" dimuat ke form");
}

function clearPriceForm(){
  ASSETS.forEach(a=>{const el=document.getElementById("pi_"+a.k);if(el)el.value="";});
}

function deletePrice(date){
  if(!confirm("Hapus data harga "+date+"?"))return;
  ST.priceHistory=ST.priceHistory.filter(p=>p.date!==date);
  savePrices();updateHeader();renderPrices();notif("✓ Dihapus");
}

function renderSignals(){
  const eOpts=Object.entries(MTYPES).map(([k,v])=>`<option value="${k}"${k===ST.sigEvent?" selected":""}>${v.l}</option>`).join("");
  const mt=MTYPES[ST.sigEvent];
  const oOpts=mt?.o.map(o=>`<option value="${o.k}"${o.k===ST.sigOut?" selected":""}>${o.l}</option>`).join("")||"";
  const key=ST.sigEvent+"_"+ST.sigOut;
  const sigs=SIG[key]||[];
  const cats=["Crypto","Forex","Komoditas","Index","Bonds"];

  // Accuracy check
  let accNote="";
  if(sigs.length&&ST.priceHistory.length>=2){
    const macroEv=[...ST.macroHistory].filter(e=>e.type===ST.sigEvent&&e.outcome===ST.sigOut).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(macroEv){
      const before=ST.priceHistory.filter(p=>p.date<=macroEv.date).slice(-1)[0];
      const after=ST.priceHistory.filter(p=>p.date>macroEv.date)[0];
      if(before&&after){
        let ok=0,tot=0;
        const accMap={};
        sigs.forEach(s=>{
          const pb=before.prices[s.a],pa=after.prices[s.a];
          if(pb&&pa){
            const chg=pct(pa,pb);
            const predicted=(s.d===L&&chg>0)||(s.d===S&&chg<0)||(s.d===N&&Math.abs(chg)<1);
            accMap[s.a]={chg,predicted};
            if(s.d!==N){tot++;if(predicted)ok++;}
          }
        });
        if(tot>0){
          const pct2=Math.round(ok/tot*100);
          accNote=`<div style="background:rgba(249,115,22,.07);border:.5px solid rgba(249,115,22,.2);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12px">
            🎯 <b style="color:#f97316">Accuracy Check</b> (${macroEv.type} ${macroEv.outcome} — ${macroEv.date}): 
            <span style="color:${pct2>=60?"#00e87a":"#ff2a45"};font-weight:700">${ok}/${tot} sinyal benar (${pct2}%)</span>
            berdasarkan data hargamu (${before.date} → ${after.date})
          </div>`;
          sigs.forEach(s=>{if(accMap[s.a])s._acc=accMap[s.a];});
        }
      }
    }
  }

  let sigHtml="";
  if(!ST.sigOut){
    sigHtml=`<div style="text-align:center;padding:30px;color:#475569"><div style="font-size:32px;margin-bottom:10px">⚡</div>Pilih Event + Outcome untuk lihat sinyal.</div>`;
  } else if(!sigs.length){
    sigHtml=`<div style="color:#475569;padding:14px">Data tidak tersedia.</div>`;
  } else {
    cats.forEach(cat=>{
      const cs=sigs.filter(s=>ASSETS.find(a=>a.k===s.a)?.cat===cat);
      if(!cs.length)return;
      sigHtml+=`<div class="stitle">${cat}</div><div class="sigrid">`;
      cs.forEach(s=>{
        const bc=s.d===L?"#00e87a":s.d===S?"#ff2a45":"#475569";
        const acc=s._acc?`<div style="font-size:10px;margin-top:4px;padding:2px 6px;border-radius:3px;background:${s._acc.predicted?"rgba(0,232,122,.1)":"rgba(255,42,69,.1)"};color:${s._acc.predicted?"#00e87a":"#ff2a45"}">Actual: ${pctStr(s._acc.chg)} ${s._acc.predicted?"✓":"✗"}</div>`:"";
        sigHtml+=`<div class="sigcard">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
            <span style="color:#f97316;font-size:12px;font-weight:700;font-family:var(--mono)">${s.a}</span>
            ${dirBadge(s.d)}
          </div>
          <div class="pbar"><div style="width:${s.p}%;height:100%;background:${bc};border-radius:2px"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:5px">

function drawChart(){
  const canvas=document.getElementById("price-chart");if(!canvas)return;
  if(ST.chartInst){ST.chartInst.destroy();ST.chartInst=null;}
  const ph=filterByTf(ST.priceHistory,ST.chartTf);
  const asset=ST.chartAsset;
  const adp=ASSETS.find(a=>a.k===asset)?.dp||0;
  const data=ph.map(p=>({x:p.date,y:p.prices[asset]||null})).filter(d=>d.y!==null);
  if(data.length<2)return;
  const macroOnChart=ST.macroHistory.filter(e=>data.some(d=>d.x===e.date));
  const ctx=canvas.getContext("2d");
  const gr=ctx.createLinearGradient(0,0,0,canvas.height);
  const chg=pct(data[data.length-1].y,data[0].y);
  const lc=chg===null||chg>=0?"#00e87a":"#ff2a45";
  gr.addColorStop(0,lc.replace("#","rgba(")+",0.25)".replace("rgba(","rgba("));
  gr.addColorStop(1,"rgba(0,0,0,0)");
  const gc=ctx.createLinearGradient(0,0,0,canvas.height);
  gc.addColorStop(0,chg>=0?"rgba(0,232,122,0.28)":"rgba(255,42,69,0.28)");
  gc.addColorStop(1,"rgba(0,0,0,0)");
  ST.chartInst=new Chart(ctx,{
    type:"line",
    data:{datasets:[{data,borderColor:lc,borderWidth:2,pointRadius:2.5,pointBackgroundColor:lc,fill:true,backgroundColor:gc,tension:0.3,spanGaps:true}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{
        x:{type:"category",ticks:{color:"#475569",font:{family:"'JetBrains Mono'",size:9},maxRotation:45,autoSkip:true,maxTicksLimit:12},grid:{color:"rgba(255,255,255,.03)"}},
        y:{ticks:{color:"#94a3b8",font:{family:"'JetBrains Mono'",size:9},callback:v=>fmt(v,adp)},grid:{color:"rgba(255,255,255,.05)"}},
      },
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:"#0d1420",borderColor:"rgba(249,115,22,.3)",borderWidth:1,titleColor:"#f97316",bodyColor:"#e2e8f0",titleFont:{family:"'Barlow Condensed'",size:13,weight:"bold"},bodyFont:{family:"'JetBrains Mono'",size:12},
          callbacks:{label:c=>`${asset}: ${fmt(c.parsed.y,adp)} | ${pctStr(pct(c.parsed.y,data[0].y))}`}},
      },animation:{duration:300},
    },
  });
  // Draw macro markers manually
  if(macroOnChart.length){
    const orig=ST.chartInst.draw.bind(ST.chartInst);
    const plugin={id:"macroLines",afterDraw(chart){
      const ctx2=chart.ctx;
      macroOnChart.forEach(ev=>{
        const idx=data.findIndex(d=>d.x===ev.date);if(idx<0)return;
        const x=chart.scales.x.getPixelForIndex(idx);
        ctx2.save();ctx2.strokeStyle="rgba(249,115,22,.55)";ctx2.lineWidth=1;ctx2.setLineDash([3,3]);
        ctx2.beginPath();ctx2.moveTo(x,chart.chartArea.top);ctx2.lineTo(x,chart.chartArea.bottom);ctx2.stroke();
        ctx2.fillStyle="#f97316";ctx2.font="bold 9px 'JetBrains Mono'";ctx2.fillText(ev.type,x+2,chart.chartArea.top+11);
        ctx2.restore();
      });
    }};
    Chart.register(plugin);
    ST.chartInst.update();
  }
}

function doExport(){
  const data={version:"1.0",exportDate:new Date().toISOString(),priceHistory:ST.priceHistory,macroHistory:ST.macroHistory};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;
  a.download="bbmacro_backup_"+new Date().toISOString().split("T")[0]+".json";
  a.click();URL.revokeObjectURL(url);
  notif("✓ Backup diunduh");
}

function doImport(){
  const file=document.getElementById("import-file")?.files?.[0];
  if(!file){notif("Pilih file JSON dulu!","err");return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.priceHistory){
        // Merge — add entries not already present
        data.priceHistory.forEach(entry=>{
          if(!ST.priceHistory.find(p=>p.date===entry.date))ST.priceHistory.push(entry);
        });
        ST.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
        savePrices();
      }
      if(data.macroHistory){
        data.macroHistory.forEach(entry=>{
          if(!ST.macroHistory.find(m=>m.id===entry.id))ST.macroHistory.push(entry);
        });
        ST.macroHistory.sort((a,b)=>a.date.localeCompare(b.date));
        saveMacro();
      }
      closeModal();updateHeader();renderDash();
      notif(`✓ Import berhasil! +${data.priceHistory?.length||0} harga, +${data.macroHistory?.length||0} macro`);
    }catch{notif("Format file tidak valid!","err");}
  };
  reader.readAsText(file);

// TSV / CSV PARSER
// ═══════════════════════════════════════════════════════════════
function parseTSV(rawText){
  const lines=rawText.trim().split('\n')
    .map(l=>l.trim())
    .filter(l=>l&&!l.startsWith('#')&&!l.startsWith('//'));
  if(!lines.length)return{rows:[],count:0,format:'none',error:'Input kosong'};

  // Auto-detect separator: tab or comma
  const firstLine=lines[0];
  const tabCount=(firstLine.match(/\t/g)||[]).length;
  const commaCount=(firstLine.match(/,/g)||[]).length;
  const sep=tabCount>commaCount?'\t':',';

  // Parse all rows into columns
  const parsed=lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));

  // Detect header: if first col is not a number or timestamp, it's a header
  const col0=parsed[0][0].toLowerCase();
  const isHeader=isNaN(parseFloat(col0))||col0.includes('date')||col0.includes('time')||col0.includes('period');
  const header=isHeader?parsed[0]:null;
  const dataRows=isHeader?parsed.slice(1):parsed;

  if(!dataRows.length)return{rows:[],count:0,format:'header_only',error:'Hanya header, tidak ada data'};

  // Detect format: OHLCV (6 cols) vs 2-col (date,value)
  const ncols=dataRows[0].length;
  let format=ncols>=5?'ohlcv':'2col';

  // Find close column index
  let closeIdx=4; // default OHLCV: time,open,high,low,close,vol
  if(header){
    const ci=header.findIndex(h=>h==='close'||h==='price'||h==='value'||h==='last');
    if(ci>=0)closeIdx=ci;
    else if(ncols===2)closeIdx=1;
  }

  const results=[];
  dataRows.forEach(cols=>{
    if(!cols.length||!cols[0])return;
    let date=null;
    const raw0=cols[0];

    // Unix timestamp (9-10 digit number)
    if(/^\d{9,10}$/.test(raw0)){
      date=new Date(parseInt(raw0)*1000).toISOString().split('T')[0];
    }
    // Unix ms timestamp (13 digit)
    else if(/^\d{13}$/.test(raw0)){
      date=new Date(parseInt(raw0)).toISOString().split('T')[0];
    }
    // YYYY-MM-DD or YYYY/MM/DD
    else if(/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(raw0)){
      const d=raw0.substring(0,10).replace(/\//g,'-');
      const parts=d.split('-');
      if(parts.length===3)date=parts[0]+'-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
    }
    // MM/DD/YYYY
    else if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(raw0)){
      const[m,d,y]=raw0.split('/');
      date=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
    }
    // DD.MM.YYYY (European)
    else if(/^\d{1,2}\.\d{1,2}\.\d{4}/.test(raw0)){
      const[d,m,y]=raw0.split('.');
      date=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
    }

    if(!date)return;

    const rawVal=(cols[closeIdx]||cols[1]||'').replace(/,/g,'').replace(/\s/g,'');
    const value=parseFloat(rawVal);
    if(!isNaN(value))results.push({date,value});
  });

  // Deduplicate: keep last occurrence per date
  const map={};
  results.forEach(r=>{map[r.date]=r.value;});
  const rows=Object.entries(map)
    .map(([date,value])=>({date,value}))
    .sort((a,b)=>a.date.localeCompare(b.date));

  return{rows,count:rows.length,format,
    dateRange:rows.length?`${rows[0].date} → ${rows[rows.length-1].date}`:''};
}

  const a=ASSETS.find(x=>x.k===key);
  const entries=ST.priceHistory
    .filter(p=>p.prices[key]!==undefined)
    .map(p=>({date:p.date,value:p.prices[key]}))
    .sort((a,b)=>b.date.localeCompare(a.date));

  if(!entries.length){notif('Tidak ada data untuk '+key,'err');return;}

  const rows=entries.map((e,i)=>`
    <tr id="arow_${i}">
      <td style="color:#64748b;font-family:var(--mono)">${e.date}</td>
      <td>
        <input id="aval_${i}" type="number" step="any" value="${e.value}"
          style="background:var(--bg3);border:.5px solid var(--border2);border-radius:3px;color:var(--text);padding:3px 7px;font-family:var(--mono);font-size:11px;width:120px">
      </td>

        <button onclick="deleteOneDate('${key}','${e.date}',${i})"
          style="background:rgba(255,42,69,.12);color:#ff2a45;border:.5px solid rgba(255,42,69,.25);border-radius:3px;padding:3px 8px;font-size:10px;font-family:var(--cond);font-weight:700">🗑</button>
      </td>
    </tr>`).join('');

  document.getElementById('mcontent').innerHTML=`
    <div class="mtitle">✏️ Kelola Data — ${key}</div>
    <div style="font-size:12px;color:#64748b;margin-bottom:12px">${a?.l} · ${entries.length} data points · ${entries[entries.length-1]?.date} → ${entries[0]?.date}</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button onclick="confirmDeleteAsset('${key}',${entries.length});closeModal()" class="btnd" style="font-size:12px;padding:6px 14px">🗑 Hapus Semua Data ${key}</button>
      <button onclick="openDeleteRangeModal('${key}')" class="btn2" style="font-size:12px">📅 Hapus Rentang Tanggal</button>
      <button onclick="closeModal()" class="btn2" style="font-size:12px;margin-left:auto">✕ Tutup</button>
    </div>

      <table>

        <tbody id="asset-edit-tbody">${rows}</tbody>
      </table>
    </div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function saveOneValue(key, date, newVal, rowIdx){
  const v=parseFloat(newVal);
  if(isNaN(v)){notif('Nilai tidak valid!','err');return;}
  const entry=ST.priceHistory.find(p=>p.date===date);
  if(entry){entry.prices[key]=v;}
  savePrices();
  // Visual feedback
  const row=document.getElementById('arow_'+rowIdx);
  if(row){row.style.background='rgba(0,232,122,.1)';setTimeout(()=>{if(row)row.style.background='';},1200);}
  notif(`✓ ${key} ${date} → ${v} disimpan`);
}

function deleteOneDate(key, date, rowIdx){
  const entry=ST.priceHistory.find(p=>p.date===date);
  if(!entry)return;
  delete entry.prices[key];
  // Remove entry if no prices left
  if(Object.keys(entry.prices).length===0){
    ST.priceHistory=ST.priceHistory.filter(p=>p.date!==date);
  }
  savePrices();
  const row=document.getElementById('arow_'+rowIdx);
  if(row)row.remove();
  notif(`✓ ${key} ${date} dihapus`);
}

function confirmDeleteAsset(key, count){
  if(!confirm(`Hapus SEMUA ${count} data untuk ${key}?\nTindakan ini tidak bisa dibatalkan.`))return;
  deleteAssetAll(key);
}

function deleteAssetAll(key){
  let removed=0;
  ST.priceHistory.forEach(entry=>{
    if(entry.prices[key]!==undefined){delete entry.prices[key];removed++;}
  });
  // Clean up empty entries
  ST.priceHistory=ST.priceHistory.filter(p=>Object.keys(p.prices).length>0);
  savePrices();
  updateHeader();
  closeModal();
  renderImport();
  notif(`✓ Semua data ${key} (${removed} pts) dihapus`);
}

function openDeleteRangeModal(key){
  const entries=ST.priceHistory.filter(p=>p.prices[key]!==undefined);
  if(!entries.length){notif('Tidak ada data','err');return;}
  const minDate=entries[0].date;
  const maxDate=entries[entries.length-1].date;

  document.getElementById('mcontent').innerHTML=`
    <div class="mtitle">📅 Hapus Rentang Tanggal — ${key}</div>
    <div style="font-size:12px;color:#64748b;margin-bottom:14px">Data tersedia: ${minDate} → ${maxDate}</div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="fgroup"><label class="flabel">Dari Tanggal</label><input type="date" id="dr-from" value="${minDate}" min="${minDate}" max="${maxDate}"></div>
      <div class="fgroup"><label class="flabel">Sampai Tanggal</label><input type="date" id="dr-to" value="${maxDate}" min="${minDate}" max="${maxDate}"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btnd" style="font-size:13px;padding:8px 16px" onclick="executeDeleteRange('${key}')">🗑 Hapus Rentang Ini</button>
      <button class="btn2" onclick="openAssetManage('${key}')">← Kembali</button>
    </div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function executeDeleteRange(key){
  const from=document.getElementById('dr-from')?.value;
  const to=document.getElementById('dr-to')?.value;
  if(!from||!to){notif('Pilih rentang tanggal','err');return;}
  let removed=0;
  ST.priceHistory.forEach(entry=>{
    if(entry.date>=from&&entry.date<=to&&entry.prices[key]!==undefined){
      delete entry.prices[key];removed++;
    }
  });
  ST.priceHistory=ST.priceHistory.filter(p=>Object.keys(p.prices).length>0);
  savePrices();
  updateHeader();
  closeModal();
  renderImport();
  notif(`✓ ${removed} data ${key} (${from} → ${to}) dihapus`);
}

  ST.priceHistory=[];ST.macroHistory=[];

  updateHeader();renderImport();
  notif('✓ Semua data direset');

function previewTSV(){
  const raw=document.getElementById('tsv-paste')?.value||'';
  if(!raw.trim()){notif('Paste data dulu!','err');return;}
  tsvPreview=parseTSV(raw);
  renderImport();
  // Scroll to preview
  setTimeout(()=>{
    const el=document.querySelector('#content .panel:nth-child(2)');
    if(el)el.scrollIntoView({behavior:'smooth',block:'end'});
  },100);
}

function executeImport(){
  if(!tsvPreview||!tsvPreview.rows||!tsvPreview.count){notif('Preview dulu!','err');return;}
  const asset=document.getElementById('tsv-asset')?.value;
  if(!asset){notif('Pilih aset!','err');return;}

  let added=0,updated=0;
  tsvPreview.rows.forEach(({date,value})=>{
    const existing=ST.priceHistory.find(p=>p.date===date);
    if(existing){existing.prices[asset]=value;updated++;}
    else{ST.priceHistory.push({date,prices:{[asset]:value}});added++;}
  });
  ST.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
  savePrices();

  // Log import
  const log=JSON.parse(localStorage.getItem('bbm_import_log')||'[]');
  log.push({date:new Date().toISOString().replace('T',' ').substring(0,16),asset,count:tsvPreview.count,range:tsvPreview.dateRange});
  localStorage.setItem('bbm_import_log',JSON.stringify(log.slice(-50)));

  tsvPreview=null;
  updateHeader();
  renderImport();
  notif(`✓ Import selesai! +${added} baru, ~${updated} update untuk ${asset}`);
}

        <div style="font-size:10px;color:${color};font-family:var(--cond);font-weight:700;margin-bottom:6px">${label}</div>
        ${keys.map(k=>`<span style="display:inline-block;font-family:var(--mono);font-size:10px;background:rgba(249,115,22,.1);color:#f97316;padding:1px 5px;border-radius:3px;margin:2px">${k}</span>`).join('')}
      </div>`).join('')}
    </div>
    <button class="btn2" style="margin-top:16px;width:100%" onclick="closeModal()">Tutup</button>`;
  document.getElementById('modal').classList.remove('hidden');
}

// ROUTER
// ═══════════════════════════════════════════════════════════════
const TABMAP={
  dash:"📊 Dashboard",
  import:"📥 Paste TSV",
  prices:"✏️ Manual Input",
  macro:"📋 Macro Log",
  signals:"⚡ Sinyal",
  chart:"📉 Chart",
  corr:"🔗 Korelasi",
  regime:"🎯 Regime"
};

function go(tab){
  ST.tab=tab;
  document.querySelectorAll(".tab").forEach(el=>{
    el.classList.toggle("active",el.textContent.trim().startsWith(TABMAP[tab]?.trim()||"____"));
  });
  if(tab==="dash")renderDash();
  else if(tab==="import"){tsvPreview=null;renderImport();}
  else if(tab==="prices")renderPrices();
  else if(tab==="macro")renderMacro();
  else if(tab==="signals")renderSignals();
  else if(tab==="chart")renderChart();
  else if(tab==="corr")renderCorr();
  else if(tab==="regime")renderRegime();
}

loadAll();
updateHeader();
renderDash();
</script>
